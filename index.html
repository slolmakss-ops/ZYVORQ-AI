<div class="bottom">
  <div class="inputbox">
    <input
      id="prompt"
      placeholder="Напиши сообщение..."
      onkeydown="if(event.key==='Enter')sendMessage()"
    >
    <button class="send" onclick="sendMessage()">➤</button>
  </div>
  <div class="note">NEXAI · Personal AI</div>
</div>

</main>

<script>

const STORAGE_KEY = "nexai_chats_v1";

let chats = [];
let activeChatId = null;

function saveChats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  } catch (error) {
    alert("Не удалось сохранить историю чатов.");
  }
}

function getActiveChat() {
  return chats.find(c => c.id === activeChatId);
}

function createChat() {
  const current = {
    id: Date.now().toString() + Math.random().toString(36).slice(2),
    title: "Новый чат",
    messages: [],
    createdAt: Date.now()
  };

  chats.unshift(current);
  activeChatId = current.id;

  saveChats();
  renderHistory();
  renderChat();
}

function newChat() {
  createChat();

  const input = document.getElementById("prompt");
  input.value = "";
  input.focus();
}

function renderHistory() {
  const list = document.getElementById("historyList");
  list.replaceChildren();

  chats.forEach(item => {
    const button = document.createElement("button");

    button.className = "history-item" +
      (item.id === activeChatId ? " active" : "");

    button.textContent = item.title;

    button.title = item.title;

    button.onclick = function() {
      activeChatId = item.id;
      renderHistory();
      renderChat();
    };

    list.appendChild(button);
  });
}

function renderChat() {
  const chatElement = document.getElementById("chat");
  chatElement.replaceChildren();

  const current = getActiveChat();

  if (!current || current.messages.length === 0) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";

    const orb = document.createElement("div");
    orb.className = "orb";

    const title = document.createElement("h1");
    title.textContent = "Привет! Я NEXAI.";

    const description = document.createElement("p");
    description.textContent = "Твой персональный AI-помощник.";

    welcome.append(orb, title, description);
    chatElement.appendChild(welcome);
    return;
  }

  current.messages.forEach(message => {
    const element = document.createElement("div");

    element.className = "message " + message.role;
    element.textContent = message.text;

    chatElement.appendChild(element);
  });

  chatElement.scrollTop = chatElement.scrollHeight;
}

function makeTitle(text) {
  const clean = text.replace(/\s+/g, " ").trim();

  if (clean.length <= 30) return clean;

  return clean.slice(0, 30).trimEnd() + "...";
}

function sendMessage() {
  const input = document.getElementById("prompt");
  const value = input.value.trim();

  if (!value) return;

  let current = getActiveChat();

  if (!current) {
    createChat();
    current = getActiveChat();
  }

  const firstMessage = !current.messages.some(
    message => message.role === "user"
  );

  current.messages.push({
    role: "user",
    text: value
  });

  if (firstMessage) {
    current.title = makeTitle(value);
  }

  current.messages.push({
    role: "bot",
    text: "Я получил твоё сообщение! Скоро здесь будет подключена настоящая нейросеть."
  });

  input.value = "";

  saveChats();
  renderHistory();
  renderChat();

  input.focus();
}

function loadChats() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    const parsed = saved ? JSON.parse(saved) : [];

    chats = Array.isArray(parsed)
      ? parsed.filter(c =>
          c &&
          typeof c.id === "string" &&
          typeof c.title === "string" &&
          Array.isArray(c.messages)
        )
      : [];

  } catch (error) {
    chats = [];
  }

  if (chats.length > 0) {
    activeChatId = chats[0].id;
  } else {
    createChat();
  }

  renderHistory();
  renderChat();
}

loadChats();

</script>

</body>
</html>
